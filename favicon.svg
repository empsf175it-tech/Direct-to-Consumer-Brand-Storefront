<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sutura-fav-bg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1B1938" />
      <stop offset="60%" stop-color="#0F0E24" />
      <stop offset="100%" stop-color="#070612" />
    </radialGradient>
    <linearGradient id="sutura-fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="30%" stop-color="#DEBB67"/>
      <stop offset="70%" stop-color="#C9A24D"/>
      <stop offset="100%" stop-color="#9E7828"/>
    </linearGradient>
    <linearGradient id="sutura-fav-needle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24D"/>
      <stop offset="45%" stop-color="#FAF7F2"/>
      <stop offset="70%" stop-color="#DEBB67"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="sutura-fav-thread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0A145"/>
      <stop offset="60%" stop-color="#E08A2B"/>
      <stop offset="100%" stop-color="#B86A18"/>
    </linearGradient>
    <filter id="sutura-fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#E08A2B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Circular Base (matching .logo-icon-box luxury emblem) -->
  <circle cx="50" cy="50" r="48" fill="url(#sutura-fav-bg)" stroke="#C9A24D" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Outer Bespoke Hand-Stitched Dial -->
  <circle cx="50" cy="50" r="44" stroke="url(#sutura-fav-gold)" stroke-width="1.3" stroke-dasharray="3.5 3.5" opacity="0.65"/>
  <circle cx="50" cy="50" r="40" stroke="url(#sutura-fav-gold)" stroke-width="0.75" opacity="0.35"/>

  <!-- Cardinal Atelier Marks -->
  <polygon points="50,6.5 51.5,9.5 50,12.5 48.5,9.5" fill="url(#sutura-fav-gold)"/>
  <polygon points="50,87.5 51.5,90.5 50,93.5 48.5,90.5" fill="url(#sutura-fav-gold)"/>
  <polygon points="6.5,50 9.5,51.5 12.5,50 9.5,48.5" fill="url(#sutura-fav-gold)"/>
  <polygon points="87.5,50 90.5,51.5 93.5,50 90.5,48.5" fill="url(#sutura-fav-gold)"/>

  <!-- Sinuous Silk Thread Weaving Through Monogram -->
  <path d="M 24 76 C 14 62, 18 45, 34 46 C 45 47, 52 40, 50 32 C 48 22, 60 16, 70 23 C 78 28, 80 38, 74 45 C 66 53, 53 56, 46 66 C 40 75, 48 83, 58 81 C 66 79, 71 72, 75 66" 
        fill="none" stroke="url(#sutura-fav-thread)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Fine Tailoring Needle Piercing Diagonally -->
  <line x1="20" y1="80" x2="80" y2="20" stroke="url(#sutura-fav-needle)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="77,23 83.5,16.5 80.5,26.5" fill="#FAF7F2" filter="url(#sutura-fav-glow)"/>
  <ellipse cx="26" cy="74" rx="1.2" ry="4.5" transform="rotate(45 26 74)" fill="#0F0E24" stroke="url(#sutura-fav-gold)" stroke-width="0.8"/>

  <!-- Haute Couture Monogram 'S' with Modulated Elegance -->
  <path d="
    M 63 26
    C 65 26, 66.5 27.5, 66.5 29.5
    C 66.5 31.8, 64.5 33.5, 62 33.5
    C 59.8 33.5, 58.5 32.2, 58.5 30.5
    C 55.5 26.5, 51.5 24.5, 46.5 24.5
    C 38 24.5, 32.5 29.5, 32.5 36.5
    C 32.5 43.5, 37.5 47.8, 45 50.8
    L 48.5 52.2
    C 56.5 55.5, 63 60.5, 63 68.5
    C 63 77.5, 55.5 83.5, 45 83.5
    C 39.5 83.5, 34 81, 30.5 76.5
    C 31.2 75.8, 31.8 74.8, 31.8 73.5
    C 31.8 71.2, 29.8 69.5, 27.5 69.5
    C 25.2 69.5, 23.5 71.2, 23.5 73.5
    C 23.5 77.2, 27.5 82, 33.5 85
    C 37 86.8, 41.5 87.5, 46 87.5
    C 59 87.5, 68.5 79.5, 68.5 68
    C 68.5 59, 62.5 53.5, 53.5 49.5
    L 50 48
    C 43 45, 38 41.5, 38 35.5
    C 38 29.8, 42.5 25.5, 49.5 25.5
    C 54.8 25.5, 59.8 27.8, 63 31.5
    Z
  " fill="url(#sutura-fav-gold)"/>
</svg>
